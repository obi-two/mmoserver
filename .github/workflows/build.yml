name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.config }} (system packages)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libboost-all-dev libtbb-dev libmysqlcppconn-dev liblua5.1-0-dev \
            libtolua++5.1-dev libnoise-dev libglm-dev libgtest-dev \
            libmysqlclient-dev zlib1g-dev

      # The plain, preset-less configure must work without any -D flags.
      - name: Configure without presets
        if: matrix.config == 'debug'
        run: cmake -S . -B build/plain

      - name: Build and test
        run: ./build_server.sh -t ${{ matrix.config == 'release' && '-r' || '' }}

  linux-vcpkg:
    name: Linux debug (vcpkg)
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl zip unzip tar pkg-config libtirpc-dev

      # Use the vcpkg release matching the baseline in vcpkg-configuration.json.
      - name: Set up vcpkg
        run: |
          git clone --depth 1 --branch 2026.10.16 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-ubuntu-24.04-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tools/vcpkg/ports/**') }}-${{ github.run_id }}
          restore-keys: vcpkg-ubuntu-24.04-

      - name: Build and test
        run: ./build_server.sh --vcpkg -t

      # Saved even when the build fails, so the next run does not rebuild the
      # packages that did succeed. vcpkg only uses entries whose ABI matches.
      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: |
            build/**/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
